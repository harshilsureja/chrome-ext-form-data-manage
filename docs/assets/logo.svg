<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- form sheet -->
  <rect x="26" y="22" width="62" height="80" rx="11" fill="url(#sheet)"/>
  <rect x="37" y="35" width="20" height="5" rx="2.5" fill="#a1a1aa"/>
  <rect x="37" y="44" width="40" height="10" rx="3.5" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <rect x="37" y="62" width="14" height="5" rx="2.5" fill="#a1a1aa"/>
  <rect x="37" y="71" width="40" height="10" rx="3.5" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>

  <!-- autofill bolt badge -->
  <circle cx="90" cy="90" r="25" fill="url(#accent)" stroke="#18181b" stroke-width="6"/>
  <path d="M93.5 74 L80 93 H89.5 L86 106 L100 86.5 H90.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
